[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cloudbypriyanka", email = "cloudbypriyanka@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.123",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "python-jose>=3.5.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
